name: Update flake

on:
  workflow_dispatch:
    inputs:
      cooldown_days:
        description: >-
          Only take third-party commits at least this many days old
          (0 for an urgent update). Inputs under yawkat/ are exempt.
        type: number
        default: 5

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      # update-flake-lock can't do this: its nix-options go before the
      # subcommand, where nix rejects --override-input.
      - name: Update flake.lock with a cooldown
        id: update
        env:
          COOLDOWN_DAYS: ${{ inputs.cooldown_days }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          .github/scripts/cooldown-update.py
      - uses: peter-evans/create-pull-request@v8
        with:
          branch: update_flake_lock_action
          delete-branch: true
          title: flake update
          body: ${{ steps.update.outputs.body }}
